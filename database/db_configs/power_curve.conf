[config]

# Config for database reading, First type into terminal: ssh -f -nNT -L 8086:localhost:8082 mu2edaq2 (Ports will be different for you, check first)
options = ["localhost", "axion_reader", 8086, "axion_db"] # host, user, port of the db, database

START_TIME = "2026-05-15 09:00:00" # Start time for reading data, format: "YYYY-MM-DD HH:MM:SS"
END_TIME   = "2026-05-18 10:00:00" # End time for reading data, format: "YYYY-MM-DD HH:MM:SS"
channels = ["4K [K]", "CalibrationPSU [V]"]  # List of channels to read
log_plot = False  # bool, whether to log scale the plot or not
